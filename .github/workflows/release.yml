name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.pkgmeta'
      - '.github/workflows/release.yml'
      - 'addon/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: package.json, the toc, the addon's Version.SEMVER and the tag name one version
        run: |
          pkg=$(node -p "require('./package.json').version")
          toc=$(sed -n 's/^## Version: *//p' addon/ClaudeWoW/ClaudeWoW.toc | tr -d '\r')
          lua=$(sed -n 's/^ClaudeWoW\.Version = {.*SEMVER = "\([^"]*\)".*/\1/p' addon/ClaudeWoW/ClaudeWoW.lua)
          echo "package.json $pkg, ClaudeWoW.toc $toc, ClaudeWoW.lua Version.SEMVER $lua"
          test "$pkg" = "$toc"
          test "$pkg" = "$lua"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag $GITHUB_REF_NAME"
            test "$GITHUB_REF_NAME" = "v$pkg"
          fi
      - name: a tag push has a non-empty CHANGELOG section for its version and a CurseForge project ID
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN != '' }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          status=0
          if ! sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | grep -Fxq "$pkg"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [$pkg]' heading. Rename [Unreleased] to [$pkg] - <date>, add the compare links, and tag again."
            status=1
          elif ! awk -v heading="## [$pkg]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "::error file=CHANGELOG.md::The '## [$pkg]' section of CHANGELOG.md is empty, so the GitHub release would have no notes. Move the [Unreleased] entries under it and tag again."
            status=1
          fi
          if ! grep -Eq '^## X-Curse-Project-ID: *[0-9]+' addon/ClaudeWoW/ClaudeWoW.toc; then
            echo "::error file=addon/ClaudeWoW/ClaudeWoW.toc::ClaudeWoW.toc has no '## X-Curse-Project-ID: <id>' line, so the packager would skip CurseForge and the run would still pass. Add the project ID and tag again."
            status=1
          fi
          if [ "$HAS_CF_API_TOKEN" != true ]; then
            echo "::error::The CF_API_TOKEN secret is not set, so the packager would skip CurseForge. Add it in the repository settings and tag again."
            status=1
          fi
          if ! grep -Eq '^## X-Wago-ID: *[A-Za-z0-9]+' addon/ClaudeWoW/ClaudeWoW.toc; then
            echo "::warning file=addon/ClaudeWoW/ClaudeWoW.toc::ClaudeWoW.toc has no '## X-Wago-ID' line; this release does not go to Wago."
          elif [ "$HAS_WAGO_API_TOKEN" != true ]; then
            echo "::error::ClaudeWoW.toc has a '## X-Wago-ID' line but the WAGO_API_TOKEN secret is not set, so the packager would skip Wago. Add it in the repository settings and tag again."
            status=1
          fi
          exit "$status"

  addon:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        with:
          args: -d
      - name: the zip holds only the ClaudeWoW folder, with its toc
        run: |
          zip=$(ls .release/*.zip)
          unzip -Z1 "$zip" | tee files.txt
          test -z "$(grep -v '^ClaudeWoW/' files.txt)"
          grep -qx 'ClaudeWoW/ClaudeWoW.toc' files.txt
          test -z "$(grep -E '^ClaudeWoW/(bridge|tests|dev|docs|build)/' files.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-zip
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

  bridge:
    needs: version
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun build.js
      - run: ./dist/claude-wow-linux-x64 service help
      - name: SHA256SUMS lists the four binaries and every sum matches
        working-directory: dist
        run: |
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-wow-binaries
          path: dist/
          if-no-files-found: error

  github-release:
    needs: [version, addon, bridge]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: claude-wow-binaries
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: addon-zip
          path: addon-zip
      - name: the downloaded binaries still match SHA256SUMS, and there is one addon zip
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          test "$(ls dist | wc -l)" -eq 5
          test "$(ls addon-zip/*.zip | wc -l)" -eq 1
      - name: the release notes are the CHANGELOG section for this version
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          cat release-notes.md
          grep -q '[^[:space:]]' release-notes.md
      - name: create the GitHub release with the addon zip, the four binaries and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease_flag=
          case "$version" in *-*) prerelease_flag=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" --title "Claude WoW $version" --notes-file release-notes.md $prerelease_flag addon-zip/*.zip dist/*

  addon-stores:
    needs: github-release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: addon-zip
          path: ${{ runner.temp }}/released-zip
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        with:
          args: -d
      - name: a fresh package of this tag has the same files, byte for byte, as the zip on the GitHub release
        run: |
          compare="$RUNNER_TEMP/compare"
          mkdir -p "$compare/released" "$compare/rebuilt"
          unzip -q "$RUNNER_TEMP"/released-zip/*.zip -d "$compare/released"
          unzip -q .release/*.zip -d "$compare/rebuilt"
          diff -r "$compare/released" "$compare/rebuilt"
      - name: upload to CurseForge and Wago
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      - name: the uploaded zip has the same files, byte for byte, as the zip on the GitHub release
        run: |
          compare="$RUNNER_TEMP/compare"
          mkdir -p "$compare/uploaded"
          unzip -q .release/*.zip -d "$compare/uploaded"
          diff -r "$compare/released" "$compare/uploaded"
