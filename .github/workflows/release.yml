name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'addon/**'
      - 'assets/plugins/**'
      - 'dev/release-key.js'
      - 'homebrew/Formula/**'
      - 'install.sh'
      - 'install.ps1'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: not a tag, so there is no release to gate
        if: github.ref_type != 'tag'
        run: echo "$GITHUB_EVENT_NAME on $GITHUB_REF; the release gate checks tags only"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.ref_type == 'tag'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.ref_type == 'tag'
        with:
          node-version: '22'
      - name: the tagged commit is on main and its ci push run has a green gate
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node dev/release-gate.js "$(git rev-parse HEAD)"

  version:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: package.json, the toc, the addon's Version.SEMVER, plugin.json, the Homebrew formula and the tag name one version
        run: |
          pkg=$(node -p "require('./package.json').version")
          toc=$(sed -n 's/^## Version: *//p' addon/WoWGPT/WoWGPT.toc | tr -d '\r')
          lua=$(sed -n 's/^WoWGPT\.Version = {.*SEMVER = "\([^"]*\)".*/\1/p' addon/WoWGPT/Transport/Slots.lua)
          plugin=$(node -p "require('./assets/plugins/wowgpt/.claude-plugin/plugin.json').version")
          formula=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' homebrew/Formula/wowgpt.rb)
          echo "package.json $pkg, WoWGPT.toc $toc, Transport/Slots.lua Version.SEMVER $lua, plugin.json $plugin, wowgpt.rb $formula"
          test "$pkg" = "$toc"
          test "$pkg" = "$lua"
          test "$pkg" = "$plugin"
          test "$pkg" = "$formula"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag $GITHUB_REF_NAME"
            test "$GITHUB_REF_NAME" = "v$pkg"
          fi
      - name: a tag push has a non-empty CHANGELOG section for its version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          if ! sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | grep -Fxq "$pkg"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [$pkg]' heading. Rename [Unreleased] to [$pkg] - <date>, add the compare links, and tag again."
            exit 1
          fi
          if ! awk -v heading="## [$pkg]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "::error file=CHANGELOG.md::The '## [$pkg]' section of CHANGELOG.md is empty, so the GitHub release would have no notes. Move the [Unreleased] entries under it and tag again."
            exit 1
          fi

  addon:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: zip the addon folder
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p .release
          (cd addon && zip -r -X -q "../.release/WoWGPT-$version.zip" WoWGPT)
      - name: the zip holds only the WoWGPT folder, with its toc
        run: |
          zip=$(ls .release/*.zip)
          unzip -Z1 "$zip" | tee files.txt
          test -z "$(grep -v '^WoWGPT/' files.txt)"
          grep -qx 'WoWGPT/WoWGPT.toc' files.txt
          grep -qx 'WoWGPT/Core/Namespace.lua' files.txt
          grep -qx 'WoWGPT/Core/Log.lua' files.txt
          grep -qx 'WoWGPT/Core/State.lua' files.txt
          grep -qx 'WoWGPT/Transport/Strip.lua' files.txt
          grep -qx 'WoWGPT/Transport/Tick.lua' files.txt
          grep -qx 'WoWGPT/Chat/Context.lua' files.txt
          grep -qx 'WoWGPT/Chat/Grants.lua' files.txt
          grep -qx 'WoWGPT/Chat/Options.lua' files.txt
          grep -qx 'WoWGPT/Chat/Sessions.lua' files.txt
          grep -qx 'WoWGPT/Whisper/Tabs.lua' files.txt
          grep -qx 'WoWGPT/Whisper/Intercept.lua' files.txt
          grep -qx 'WoWGPT/UI/Markdown.lua' files.txt
          grep -qx 'WoWGPT/UI/Window.lua' files.txt
          grep -qx 'WoWGPT/Commands/Diag.lua' files.txt
          grep -qx 'WoWGPT/Commands/Registry.lua' files.txt
          grep -qx 'WoWGPT/Commands/Claude.lua' files.txt
          grep -qx 'WoWGPT/Commands/Config.lua' files.txt
          grep -qx 'WoWGPT/Boot.lua' files.txt
          test -z "$(grep -E '^WoWGPT/(assets|bridge|build|dev|docs|homebrew|tests)/' files.txt)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-zip
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

  bridge:
    needs: version
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: npm ci --omit=dev
      - run: bun build.js
      - run: ./dist/wowgpt-linux-x64 service help
      - name: SHA256SUMS lists the four binaries and every sum matches
        working-directory: dist
        run: |
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wowgpt-binaries
          path: dist/
          if-no-files-found: error

  sign:
    needs: bridge
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wowgpt-binaries
          path: dist
      - name: sign SHA256SUMS with the release key, and check the signature under the public key the binaries carry
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          node dev/release-key.js sign dist/SHA256SUMS
          node dev/release-key.js verify dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sums-signature
          path: dist/SHA256SUMS.sig
          if-no-files-found: error

  github-release:
    needs: [version, addon, bridge, sign]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wowgpt-binaries
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: addon-zip
          path: addon-zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sums-signature
          path: dist
      - name: the downloaded binaries still match SHA256SUMS, its signature still verifies, and there is one addon zip
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          node dev/release-key.js verify dist/SHA256SUMS
          test "$(ls dist | wc -l)" -eq 6
          test "$(ls addon-zip/*.zip | wc -l)" -eq 1
      - name: the release notes are the CHANGELOG section for this version
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          cat release-notes.md
          grep -q '[^[:space:]]' release-notes.md
      - name: create the GitHub release with the addon zip, the four binaries, SHA256SUMS, SHA256SUMS.sig and the two installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease_flag=
          case "$version" in *-*) prerelease_flag=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" --title "WoWGPT $version" --notes-file release-notes.md $prerelease_flag addon-zip/*.zip dist/* install.sh install.ps1

  homebrew-tap:
    needs: [version, github-release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wowgpt-binaries
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sums-signature
          path: dist
      - name: SHA256SUMS still matches the binaries and its signature still verifies
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          node dev/release-key.js verify dist/SHA256SUMS
      - name: fill the formula's version and its two darwin sums from SHA256SUMS
        run: |
          node dev/brew-formula.js homebrew/Formula/wowgpt.rb dist/SHA256SUMS "${GITHUB_REF_NAME#v}"
          grep -n 'version "\|sha256 "' homebrew/Formula/wowgpt.rb
      - name: push the formula to rdimascio/homebrew-wowgpt
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN is not set, so the Homebrew tap was not updated. Add a token that can push to rdimascio/homebrew-wowgpt as the TAP_TOKEN secret and re-run this job."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/rdimascio/homebrew-wowgpt.git" tap
          mkdir -p tap/Formula
          cp homebrew/Formula/wowgpt.rb tap/Formula/wowgpt.rb
          git -C tap add Formula/wowgpt.rb
          if git -C tap diff --cached --quiet; then
            echo "the tap already has this formula"
            exit 0
          fi
          git -C tap -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "wowgpt ${GITHUB_REF_NAME#v}"
          git -C tap push origin HEAD

  npm-publish:
    needs: [sign, github-release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: publish the package to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set, so the package was not published to npm. Add an npm automation token as the NPM_TOKEN secret and re-run this job."
            exit 0
          fi
          node dev/pack-check.js --publish
          version=${GITHUB_REF_NAME#v}
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag"
